# Render.com blueprint — deploys this app automatically on every push.
# Sign in at https://render.com → "New → Blueprint" and pick this repo, or just
# create a "Web Service" and point it at this repo (it auto-detects Python).
#
# NOTE: use render.yaml as the single source of truth for the start command.
# Do NOT add a Procfile — Render would otherwise try to execute the Procfile
# line verbatim (including the "web:" prefix) and fail with
# "bash: web:: command not found".
services:
  - type: web
    name: vp-anomaly-map
    runtime: python
    plan: free
    # The warm-up builds the Relative AAM climatology cache inside the deployed
    # image (a few minutes, once per deploy) so that no request ever has to build
    # it — that build is what used to OOM the 512 MB free instance.  `|| true`
    # keeps a NOAA hiccup from failing the whole deploy: the app then simply
    # builds the cache on its first request, as before.
    buildCommand: "pip install -r requirements.txt && (python custom/_warm_cache.py || true)"
    startCommand: "gunicorn -b 0.0.0.0:$PORT --timeout 300 app:app"
    # Render injects its own $PORT; do NOT override it here.
