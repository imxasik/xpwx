<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reanalysis Maps · PSL/NOAA</title>
<style>
  :root{
    --bg:#f2efe8; --panel:#ffffff; --ink:#171712; --mut:#76745f;
    --line:#ddd6c6; --acc:#b0392e; --acc2:#1b4f6b; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;
  }

  /* ---------- header (sticky — stays visible on scroll) ---------- */
  header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .brand .dot{width:26px;height:26px;border-radius:7px;background:var(--acc);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.5px}
  /* hamburger — mobile only */
  .menubtn{display:none;border:1px solid var(--line);background:#fff;width:40px;height:40px;
    border-radius:9px;cursor:pointer;align-items:center;justify-content:center;padding:0}
  .menubtn span,.menubtn span::before,.menubtn span::after{
    display:block;width:20px;height:2px;background:var(--ink);position:relative;transition:.2s}
  .menubtn span::before,.menubtn span::after{content:"";position:absolute;left:0}
  .menubtn span::before{top:-6px}
  .menubtn span::after{top:6px}
  body.menu-open .menubtn span{background:transparent}
  body.menu-open .menubtn span::before{top:0;transform:rotate(45deg)}
  body.menu-open .menubtn span::after{top:0;transform:rotate(-45deg)}

  /* ---------- layout ---------- */
  .app{flex:1;display:grid;grid-template-columns:250px 1fr;min-height:0}
  main{overflow-y:auto;padding:20px 20px 28px;min-height:0}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    main{padding:14px 12px}
    .menubtn{display:flex}              /* show hamburger */

    /* sidebar slides in as a scrollable drawer */
    .side{position:fixed;top:0;bottom:0;left:0;width:272px;z-index:120;
      background:#fff;border-right:1px solid var(--line);padding:16px 14px;
      transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 8px 30px rgba(0,0,0,.15);
      overflow-y:auto;overscroll-behavior:contain}
    body.menu-open .side{transform:translateX(0)}
    .side-list{display:flex;flex-direction:column;gap:7px}
    .side-item{min-width:0}
    .side h4{position:sticky;top:0;background:#fff;z-index:1;padding-bottom:8px;margin-bottom:8px}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:110;
      opacity:0;pointer-events:none;transition:.2s}
    body.menu-open .backdrop{opacity:1;pointer-events:auto}

    /* controls — centered stack, inputs fit */
    .controls{padding:14px 12px}
    .rowf{max-width:100%}
    .btn{width:100%;text-align:center}
  }

  /* ---------- sidebar (desktop) ---------- */
  .side{border-right:1px solid var(--line);background:#fbfaf7;padding:16px 14px}
  .side h4{margin:2px 6px 12px;font-size:11px;letter-spacing:1.2px;color:var(--mut);font-weight:700}
  .side-list{display:flex;flex-direction:column;gap:7px}
  .side-item{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;
    cursor:pointer;transition:.12s}
  .side-item:hover{border-color:#c3bba8;background:#faf9f4}
  .side-item.active{border-color:var(--acc);background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.05)}
  .side-item .tag{font-size:10px;font-weight:700;color:#fff;background:var(--acc2);
    padding:2px 8px;border-radius:999px;margin-bottom:6px;display:inline-block}
  .side-item .nm{font-weight:700;font-size:13.5px}
  .side-item .ds{font-size:11px;color:var(--mut);line-height:1.4;margin-top:4px}

  /* ---------- controls (centered, professional) ---------- */
  .controls{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;
    background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 16px}
  .field{display:flex;flex-direction:column;gap:5px;align-items:center}
  .field label{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.4px}
  select,input{font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);width:100%;min-width:130px}
  /* mode toggle — centered professional pills */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .seg button{padding:9px 20px;border:0;background:#fff;cursor:pointer;font-size:13px;color:var(--mut);
    font-weight:600;transition:.12s;min-width:96px}
  .seg button:hover{background:#f4f2ec}
  .seg button.active{background:var(--acc2);color:#fff}
  /* end date + days — one aligned row */
  .rowf{display:flex;align-items:flex-end;gap:12px;width:100%;max-width:440px}
  .rowf .field{flex:1;align-items:stretch}
  .rowf .field input{width:100%}
  /* compare — two ranges */
  .comparebox{display:flex;flex-direction:column;gap:12px;width:100%;max-width:480px}
  .comparebox .rowf{max-width:100%}
  .range-tag{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.5px;text-align:center}
  /* difference toggle */
  .chk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink);
    cursor:pointer;user-select:none;font-weight:600}
  .chk input{width:18px;height:18px;accent-color:var(--acc2);cursor:pointer}
  /* results — one or two maps */
  .cmpgrid{display:flex;flex-wrap:wrap;gap:14px}
  .mcard{flex:1 1 280px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:10px;display:flex;flex-direction:column;gap:8px}
  .mcard img{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
  .mcard figcaption{font-size:12px;color:var(--mut);text-align:center;line-height:1.4;font-weight:600}
  .mcard .dl{align-self:center}
  @media(max-width:820px){.mcard{flex:1 1 100%}}
  .btn{border:0;cursor:pointer;font-weight:700;font-size:14px;padding:9px 26px;border-radius:8px;
    background:var(--acc);color:#fff;transition:.12s}
  .btn:hover{filter:brightness(.95)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:#fff;color:var(--acc2);border:1px solid var(--acc2)}
  .btn.sm{padding:6px 13px;font-size:12.5px}

  /* ---------- viewer ---------- */
  .stage{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .stage .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 15px;border-bottom:1px solid var(--line);background:#faf9f4}
  .stage .bar .meta{font-size:12.5px;color:var(--mut)}
  .bar .meta b{color:var(--ink)}
  .imgwrap{padding:12px;max-width:1700px;margin:0 auto}
  .imgwrap img{display:block;width:100%;height:auto;border-radius:7px;border:1px solid var(--line)}
  .ph{min-height:260px;display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--mut);font-size:13.5px}
  .spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--acc);
    border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

  #status{text-align:center;font-size:12.5px;color:var(--mut);min-height:16px;margin:10px 0}
  #status.ok{color:var(--ok);font-weight:700}
  #status.err{color:var(--acc);font-weight:700}
  details{margin:10px auto 0;max-width:1240px}
  summary{cursor:pointer;font-size:12px;color:var(--mut);font-weight:700}
  pre{background:#15151d;color:#cfe3cf;font-size:11.5px;border-radius:8px;padding:11px 13px;
    line-height:1.5;overflow:auto;max-height:200px;white-space:pre-wrap;margin:8px 0 0}
  a.dl{text-decoration:none}

  /* ---------- footer (fixed, full-width bar like the header) ---------- */
  footer{flex:0 0 auto;position:sticky;bottom:0;width:100%;z-index:90;display:flex;align-items:center;
    justify-content:space-between;gap:12px;padding:11px 20px;background:#fff;
    border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
  footer .foot{display:flex;align-items:center;gap:8px}
  footer .foot b{color:var(--ink);font-weight:700}
  .backdrop{display:none}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="dot">W</div>
      <div>Reanalysis Maps<small>NCEP/NCAR · PSL/NOAA</small></div>
    </div>
    <button class="menubtn" id="menubtn" onclick="toggleMenu()" aria-label="Menu">
      <span></span>
    </button>
  </header>

  <div class="backdrop" onclick="closeMenu()"></div>

  <div class="app">
    <aside class="side">
      <h4>PRODUCTS</h4>
      <div class="side-list">
        {% for p in products %}
        <div class="side-item {{ 'active' if p.id == default_product }}" data-id="{{ p.id }}"
             onclick="pick('{{ p.id }}')">
          <span class="tag">{{ p.tag }}</span>
          <div class="nm">{{ p.name }}</div>
          <div class="ds">{{ p.desc }}</div>
        </div>
        {% endfor %}
      </div>
    </aside>

    <main>
      <section class="controls">
        <div class="field">
          <label>CHOOSE MODE</label>
          <div class="seg">
            <button id="m-auto" class="active" onclick="setMode('auto')">Auto</button>
            <button id="m-manual" onclick="setMode('manual')">Manual</button>
            <button id="m-compare" onclick="setMode('compare')">Compare</button>
          </div>
        </div>

        <!-- single range (manual) -->
        <div class="rowf" id="single-range">
          <div class="field">
            <label>END DATE</label>
            <input type="date" id="date" value="{{ today }}" disabled />
          </div>
          <div class="field">
            <label>DAYS</label>
            <input type="number" id="ndays" value="{{ default_n_days }}" min="1" max="30" step="1" />
          </div>
        </div>

        <!-- two ranges (compare) -->
        <div class="comparebox" id="compare-ranges" style="display:none">
          <div class="range-tag">RANGE A</div>
          <div class="rowf">
            <div class="field"><label>END DATE</label>
              <input type="date" id="date1" value="{{ today }}"></div>
            <div class="field"><label>DAYS</label>
              <input type="number" id="ndays1" value="{{ default_n_days }}" min="1" max="30" step="1"></div>
          </div>
          <div class="range-tag">RANGE B</div>
          <div class="rowf">
            <div class="field"><label>END DATE</label>
              <input type="date" id="date2" value="{{ today }}"></div>
            <div class="field"><label>DAYS</label>
              <input type="number" id="ndays2" value="{{ default_n_days }}" min="1" max="30" step="1"></div>
          </div>
          <label class="chk">
            <input type="checkbox" id="diffMode" onchange="run()">
            Difference map &nbsp;(B − A)
          </label>
        </div>

        <button class="btn" id="go" onclick="run()">&#9654; Map</button>
      </section>

      <section class="stage">
        <div class="bar">
          <div class="meta" id="meta">Ready.</div>
        </div>
        <div class="imgwrap">
          <div class="ph" id="ph"><span class="spin"></span><span id="phText">Select a product…</span></div>
          <div id="results"></div>
        </div>
      </section>

      <div id="status"></div>
      <details><summary>Processing log</summary><pre id="log"></pre></details>
    </main>
  </div>

  <footer>
    <div class="foot"><b>@XPWEATHER</b></div>
    <div class="foot">NCEP/NCAR Reanalysis · PSL/NOAA</div>
  </footer>

<script>
  let mode = "auto", current = "{{ default_product }}";
  const cache = {},   // cacheKey -> {url, label, key, slug}
        S = document.getElementById("status"),
        PH = document.getElementById("ph"), PT = document.getElementById("phText"),
        LOG = document.getElementById("log"), META = document.getElementById("meta"),
        RESULTS = document.getElementById("results"),
        DATE = document.getElementById("date"),
        D1 = document.getElementById("date1"), D2 = document.getElementById("date2"),
        N1 = document.getElementById("ndays1"), N2 = document.getElementById("ndays2");

  const PROD = {{ products | tojson }};
  const P = id => PROD.find(x => x.id === id);
  const money = (v) => parseInt(v.value,10)||5;

  function rangeLabel(datestr, ndays){
    const end = new Date(datestr+"T00:00:00");
    const start = new Date(end); start.setDate(start.getDate() - (ndays-1));
    const f = x => x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
    return `${f(start)} – ${f(end)}  (${ndays}-day)`;
  }

  // ---------- mobile menu ----------
  function toggleMenu(){ document.body.classList.toggle("menu-open"); }
  function closeMenu(){ document.body.classList.remove("menu-open"); }

  function pick(id){
    current = id;
    document.querySelectorAll(".side-item").forEach(el =>
      el.classList.toggle("active", el.dataset.id === id));
    closeMenu();        // close drawer after selecting on mobile
    run();
  }
  function setMode(m){
    mode = m;
    document.getElementById("m-auto").classList.toggle("active", m==="auto");
    document.getElementById("m-manual").classList.toggle("active", m==="manual");
    document.getElementById("m-compare").classList.toggle("active", m==="compare");
    document.getElementById("single-range").style.display = (m==="manual") ? "flex" : "none";
    document.getElementById("compare-ranges").style.display = (m==="compare") ? "flex" : "none";
    DATE.disabled = (m !== "manual");
  }

  // build a job for one range
  function job(modeVal, dateVal, n, tag){
    const body = { product: current, mode: modeVal, n_days: n };
    let label;
    if (modeVal === "manual"){ body.date = dateVal; label = rangeLabel(dateVal, n); }
    else { label = (n + "-day mean, latest available"); }
    const key = JSON.stringify(body);
    return { body, key, label, slug: (tag ? tag + "_" : "") + (dateVal || "latest") };
  }

  async function fetchJob(j){
    try{
      const r = await fetch("/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(j.body)});
      if(!r.ok){ let m="Server error "+r.status; try{const jj=await r.json(); m=jj.error||m; if(jj.log)LOG.textContent=jj.log.join("\n");}catch(e){} throw new Error(m); }
      const url = URL.createObjectURL(await r.blob());
      const entry = { url, label: j.label, key: j.key, slug: j.slug };
      cache[j.key] = entry;
      return entry;
    }catch(e){ throw e; }
  }

  function renderCards(cards){
    RESULTS.innerHTML = "";
    const wrap = document.createElement("div"); wrap.className = "cmpgrid";
    cards.forEach(c => {
      const fig = document.createElement("figure"); fig.className = "mcard";
      const img = document.createElement("img"); img.src = c.url; img.alt = c.label;
      const cap = document.createElement("figcaption"); cap.textContent = c.label;
      const a = document.createElement("a"); a.className = "btn ghost sm dl";
      a.href = c.url; a.download = current + "_" + c.slug + ".png"; a.textContent = "Download PNG";
      fig.appendChild(img); fig.appendChild(cap); fig.appendChild(a);
      wrap.appendChild(fig);
    });
    RESULTS.appendChild(wrap);
  }

  async function run(){
    const p = P(current);

    // ---- compare as a single difference map (B − A) ----
    if (mode === "compare" && document.getElementById("diffMode").checked){
      if (!D1.value || !D2.value){ S.textContent="Pick both end dates."; S.className="err"; return; }
      return await runDiff();
    }

    // gather jobs for the selected mode
    let jobs;
    if (mode === "compare"){
      if (!D1.value || !D2.value){ S.textContent="Pick both end dates."; S.className="err"; return; }
      jobs = [ job("manual", D1.value, money(N1), "A"), job("manual", D2.value, money(N2), "B") ];
    } else if (mode === "manual"){
      if (!DATE.value){ S.textContent="Pick an end date."; S.className="err"; return; }
      jobs = [ job("manual", DATE.value, money(document.getElementById("ndays")), "") ];
    } else {
      jobs = [ job("auto", null, money(document.getElementById("ndays")), "") ];
    }

    // serve any cached entries
    const out = [];
    let missing = [];
    jobs.forEach(j => { if (cache[j.key]) out.push({el:j, hit:cache[j.key]}); else missing.push(j); });

    if (missing.length){
      document.getElementById("go").disabled = true;
      PH.style.display = "flex"; PT.textContent = "Rendering…";
      try{
        const loaded = await Promise.all(missing.map(fetchJob));
        missing.forEach(j => {
          const found = loaded.find(x => x.key === j.key);
          out.push({el:j, hit:found});
        });
      }catch(e){
        S.textContent = "Error: " + (e.message||e); S.className = "err";
        PH.style.display = "none"; document.getElementById("go").disabled = false; return;
      }
      PH.style.display = "none";
      document.getElementById("go").disabled = false;
    } else {
      S.textContent = "Cache · instant."; S.className = "ok";
    }

    renderCards(out.map(o => o.hit));
    META.innerHTML = "<b>" + p.name + "</b> · " + (mode==="compare" ? "Compare 2 ranges" : mode);
    S.textContent = (mode==="compare" ? "Comparison ready." : "Ready."); S.className = "ok";
  }

  // ---- compare as ONE difference map (B − A) ----
  async function runDiff(){
    const p = P(current);
    const body = { product: current, date1: D1.value, n_days1: money(N1),
                   date2: D2.value, n_days2: money(N2) };
    const key = "diff:" + JSON.stringify(body);

    if (cache[key]){
      renderCards([cache[key]]);
      META.innerHTML = "<b>" + p.name + "</b> · Difference (B − A)";
      S.textContent = "Cache · instant."; S.className = "ok";
      return;
    }

    document.getElementById("go").disabled = true;
    PH.style.display = "flex"; PT.textContent = "Computing difference (B − A)…";
    try{
      const r = await fetch("/diff",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!r.ok){ let m="Server error "+r.status; try{const j=await r.json(); m=j.error||m; if(j.log)LOG.textContent=j.log.join("\n");}catch(e){} throw new Error(m); }
      const url = URL.createObjectURL(await r.blob());
      const entry = { url, key, slug:"diff",
        label: "Difference (B − A)  ·  " + rangeLabel(D1.value, money(N1)) + "  −  " + rangeLabel(D2.value, money(N2)) };
      cache[key] = entry;
      renderCards([entry]);
      META.innerHTML = "<b>" + p.name + "</b> · Difference (B − A)";
      S.textContent = "Difference map ready."; S.className = "ok";
    }catch(e){
      S.textContent = "Error: " + (e.message||e); S.className = "err";
    }finally{
      PH.style.display = "none"; document.getElementById("go").disabled = false;
    }
  }

  run();
</script>

</html>
