<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reanalysis Maps · PSL/NOAA</title>
<style>
  :root{
    --bg:#f2efe8; --panel:#ffffff; --ink:#171712; --mut:#76745f;
    --line:#ddd6c6; --acc:#b0392e; --acc2:#1b4f6b; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;
  }

  /* top bar */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .brand .dot{width:26px;height:26px;border-radius:7px;background:var(--acc);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.5px}
  header .right{font-size:12px;color:var(--mut)}

  /* layout */
  .app{flex:1;display:grid;grid-template-columns:250px 1fr;min-height:0}
  main{overflow-y:auto;padding:20px;min-height:0}
  @media(max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .side{border-right:0;border-bottom:1px solid var(--line);padding:12px 12px}
    /* force the product list into a single horizontal scrollable row */
    .side-list{display:flex;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px}
    .side-item{min-width:150px;flex:0 0 auto}
    .side-item .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
    main{padding:14px 12px}
    /* controls stack so mode / date / days / button are all visible */
    .controls{gap:10px}
    .field{flex:1 1 100%}
    select,input{width:100%;min-width:0}
    .grow{display:none}
    .btn{width:100%;text-align:center}
  }

  /* sidebar */
  .side{border-right:1px solid var(--line);background:#fff;padding:16px 14px}
  .side h4{margin:2px 6px 12px;font-size:11px;letter-spacing:1.2px;color:var(--mut);font-weight:700}
  .side-list{display:flex;flex-direction:column;gap:7px}
  .side-item{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#faf9f4;
    cursor:pointer;transition:.12s}
  .side-item:hover{border-color:#c3bba8;background:#fff}
  .side-item.active{border-color:var(--acc);background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.05)}
  .side-item .tag{font-size:10px;font-weight:700;color:#fff;background:var(--acc2);
    padding:2px 8px;border-radius:999px;margin-bottom:6px;display:inline-block}
  .side-item .nm{font-weight:700;font-size:13.5px}
  .side-item .ds{font-size:11px;color:var(--mut);line-height:1.4;margin-top:4px}

  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px;
    background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.4px}
  select,input{font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);min-width:130px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:7px 14px;border:0;background:#fff;cursor:pointer;font-size:13px;color:var(--mut)}
  .seg button.active{background:var(--acc2);color:#fff}
  .grow{flex:1}
  .btn{border:0;cursor:pointer;font-weight:700;font-size:14px;padding:9px 20px;border-radius:8px;
    background:var(--acc);color:#fff;transition:.12s}
  .btn:hover{filter:brightness(.95)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:#fff;color:var(--acc2);border:1px solid var(--acc2)}
  .btn.sm{padding:6px 13px;font-size:12.5px}

  /* viewer: image scales to full width, keeps ratio */
  .stage{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .stage .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 15px;border-bottom:1px solid var(--line);background:#faf9f4}
  .stage .bar .meta{font-size:12.5px;color:var(--mut)}
  .bar .meta b{color:var(--ink)}
  .imgwrap{padding:12px;max-width:1240px;margin:0 auto}
  .imgwrap img{display:block;width:100%;height:auto;border-radius:7px;border:1px solid var(--line)}
  .ph{min-height:260px;display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--mut);font-size:13.5px}
  .spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--acc);
    border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

  #status{text-align:center;font-size:12.5px;color:var(--mut);min-height:16px;margin:10px 0}
  #status.ok{color:var(--ok);font-weight:700}
  #status.err{color:var(--acc);font-weight:700}
  details{margin:10px auto 0;max-width:1240px}
  summary{cursor:pointer;font-size:12px;color:var(--mut);font-weight:700}
  pre{background:#15151d;color:#cfe3cf;font-size:11.5px;border-radius:8px;padding:11px 13px;
    line-height:1.5;overflow:auto;max-height:200px;white-space:pre-wrap;margin:8px 0 0}
  a.dl{text-decoration:none}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="dot">W</div>
      <div>Reanalysis Maps<small>NCEP/NCAR · PSL/NOAA</small></div>
    </div>
    <div class="right">@XPWEATHER</div>
  </header>

  <div class="app">
    <aside class="side">
      <h4>PRODUCTS</h4>
      <div class="side-list">
        {% for p in products %}
        <div class="side-item {{ 'active' if p.id == default_product }}" data-id="{{ p.id }}"
             onclick="pick('{{ p.id }}')">
          <span class="tag">{{ p.tag }}</span>
          <div class="nm">{{ p.name }}</div>
          <div class="ds">{{ p.desc }}</div>
        </div>
        {% endfor %}
      </div>
    </aside>

    <main>
      <section class="controls">
        <div class="field">
          <label>MODE</label>
          <div class="seg">
            <button id="m-auto" class="active" onclick="setMode('auto')">Auto</button>
            <button id="m-manual" onclick="setMode('manual')">Manual</button>
          </div>
        </div>
        <div class="field">
          <label>END DATE</label>
          <input type="date" id="date" value="{{ today }}" disabled />
        </div>
        <div class="field">
          <label>DAYS</label>
          <input type="number" id="ndays" value="{{ default_n_days }}" min="1" max="30" step="1" />
        </div>
        <div class="grow"></div>
        <button class="btn" id="go" onclick="run()">&#9654; Map</button>
      </section>

      <section class="stage">
        <div class="bar">
          <div class="meta" id="meta">Ready.</div>
          <a class="btn ghost sm dl" id="dl" style="display:none" download="map.png">&#8615; Download</a>
        </div>
        <div class="imgwrap">
          <div class="ph" id="ph"><span class="spin"></span><span id="phText">Select a product…</span></div>
          <img id="img" alt="reanalysis map" style="display:none" />
        </div>
      </section>

      <div id="status"></div>
      <details><summary>Processing log</summary><pre id="log"></pre></details>
    </main>
  </div>

<script>
  let mode = "auto", current = "{{ default_product }}";
  const cache = {}, DATE = document.getElementById("date"),
        S = document.getElementById("status"),
        PH = document.getElementById("ph"), PT = document.getElementById("phText"),
        IMG = document.getElementById("img"), DL = document.getElementById("dl"),
        LOG = document.getElementById("log"), META = document.getElementById("meta");

  const PROD = {{ products | tojson }};
  const P = id => PROD.find(x => x.id === id);

  function pick(id){
    current = id;
    document.querySelectorAll(".side-item").forEach(el =>
      el.classList.toggle("active", el.dataset.id === id));
    DL.setAttribute("download", id + ".png");
    run();
  }
  function setMode(m){
    mode = m;
    document.getElementById("m-auto").classList.toggle("active", m === "auto");
    document.getElementById("m-manual").classList.toggle("active", m === "manual");
    DATE.disabled = m === "auto";
  }
  function key(){
    return JSON.stringify({p:current, m:mode, d:DATE.value||null, n:+nd()});
  }
  function nd(){ return parseInt(document.getElementById("ndays").value,10)||5; }

  async function run(){
    const p = P(current);
    const ndv = nd();
    if (mode === "manual" && !DATE.value){ S.textContent="Pick an end date."; S.className="err"; return; }
    const k = key();

    if (cache[k]){ show(cache[k]); S.textContent="Cache · instant."; S.className="ok"; return; }

    document.getElementById("go").disabled = true;
    PH.style.display = "flex"; PT.textContent = "Rendering…"; IMG.style.display = "none"; DL.style.display = "none";
    LOG.textContent = p.title + "\n" + (mode==="manual" ? "to "+DATE.value : "auto") + " · " + ndv + "-day mean";

    const body = { product: current, mode, n_days: ndv };
    if (mode === "manual") body.date = DATE.value;

    try{
      const r = await fetch("/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!r.ok){ let m="Server error "+r.status; try{const j=await r.json(); m=j.error||m; if(j.log)LOG.textContent=j.log.join("\n");}catch(e){} throw new Error(m); }
      const url = URL.createObjectURL(await r.blob());
      cache[k] = url; show(url);
      S.textContent = "Ready."; S.className = "ok";
    }catch(e){
      S.textContent = "Error: " + (e.message||e); S.className = "err";
    }finally{
      PH.style.display = "none"; document.getElementById("go").disabled = false;
    }
  }
  function show(url){
    IMG.src = url; IMG.style.display = "block";
    DL.href = url; DL.style.display = "inline-block";
    META.innerHTML = "<b>" + P(current).name + "</b> · " + (mode==="manual" ? "to "+DATE.value : "auto") + " · " + nd() + "-day";
  }

  const p0 = P(current);
  if(p0){ DL.setAttribute("download", current+".png"); }
  run();
</script>

</html>
