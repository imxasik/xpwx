# fly.toml app configuration file generated for xpwx on 2026-09-04T00:40:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xpwx'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Persistent volume — stores LTM climatology .npy files (~3 MB/var/level) and
# GRIB byte-range cache (.bin) so they survive machine restarts/suspends.
# Create once with: fly volumes create xpwx_cache --size 1 --region ams
[[mounts]]
  source      = "xpwx_cache"
  destination = "/data"
